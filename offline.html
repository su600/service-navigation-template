<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2457d6">
<title>当前离线 · 导航示例</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f3f6fb;color:#172033;font:15px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.box{max-width:360px;text-align:center}.mark{width:56px;height:56px;margin:0 auto 18px;border-radius:16px;background:#2457d6;color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px}h1{margin:0 0 6px;font-size:20px}p{margin:0 0 20px;color:#69758a}button{height:40px;padding:0 18px;border:0;border-radius:10px;background:#2457d6;color:#fff;font:inherit;font-weight:600;cursor:pointer}button:hover{background:#1b45b2}:focus-visible{outline:2px solid #2457d6;outline-offset:3px}
</style>
</head>
<body><main class="box"><div class="mark" aria-hidden="true">SN</div><h1>当前离线</h1><p>无法连接到导航页面。网络恢复后重新打开即可继续访问。</p><button type="button" onclick="location.reload()">重新连接</button></main></body>
</html>
